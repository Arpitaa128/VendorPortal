<!DOCTYPE html>
<html>

<head>

    <title>Vendor Login</title>

</head>

<body>

    <h2>Vendor Login</h2>

    <form method="POST">

        {% csrf_token %}

        <table cellpadding="10">

            <tr>
                <td>Username</td>
                <td><input type="text" name="username"></td>
            </tr>

            <tr>
                <td>Password</td>
                <td><input type="password" name="password"></td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Login">
                </td>
            </tr>

        </table>

    </form>

</body>

</html>
